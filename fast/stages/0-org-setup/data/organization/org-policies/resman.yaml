

##### <--- default enabled constraints ---> #####
## organization policies required for the migration
## https://cloud.google.com/resource-manager/docs/configure-org-policy
resourcemanager.allowedExportDestinations:
  rules:
    - allow:
        all: true
        # values:
        #   - under:organizations/${organization.id}

resourcemanager.allowedImportSources:
  rules:
    - allow:
        all: true
        # values:
        #   - under:organizations/${organization.id}

resourcemanager.allowEnabledServicesForExport:
  rules:
    - allow:
        all: true

##### <--- default enabled constraints ---> #####
# This list constraint defines the set of services allowed for marketplace organizations, and can only include values from the list below:
# [PRIVATE_MARKETPLACE, IAAS_PROCUREMENT]. If the IAAS_PROCUREMENT is in the allowed value list, the IaaS procurement governance experience is enabled for all products.
#  By default, the IaaS procurement governance experience is turned off.
# The IAAS_PROCUREMENT policy works independently from the Request Procurement governance capability, which is specifically for SaaS products listed on Cloud Marketplace.
# Note: The PRIVATE_MARKETPLACE value is no longer supported and using it has no effect.
# To turn on Google Private Marketplace, you must follow the instructions at https://cloud.google.com/marketplace/docs/governance/enable-private-marketplace.


commerceorggovernance.marketplaceServices:
  rules:
    - deny:
        all: true
